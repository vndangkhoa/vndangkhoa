<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .key { fill: #ffa657; font-weight: 600; font-size: 13px; }
    .val { fill: #a5d6ff; font-size: 13px; }
    .head { fill: #58a6ff; font-weight: 700; font-size: 14.5px; }
    .div { fill: #616e7f; font-size: 13px; }
    .cursor { animation: blink 1s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    text, tspan { white-space: pre; }
  </style>

  <!-- Outer Window Frame -->
  <rect x="1" y="1" width="858" height="378" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Terminal Header / Titlebar -->
  <path d="M 1 13 A 12 12 0 0 1 13 1 L 847 1 A 12 12 0 0 1 859 13 L 859 42 L 1 42 Z" fill="#161b22" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="430" y="26" fill="#8b949e" font-size="13" class="font-mono" text-anchor="middle" font-weight="500">
    khoa@homelab: ~ (zsh)
  </text>

  <!-- Status Pill -->
  <g transform="translate(720, 12)">
    <rect width="115" height="18" rx="9" fill="#21262d" stroke="#30363d" />
    <circle cx="12" cy="9" r="4" fill="#3fb950" filter="url(#glow)" />
    <text x="24" y="13" fill="#8b949e" font-size="10" class="font-mono">ONLINE 99.9%</text>
  </g>

  <!-- Command Prompt Line -->
  <text x="32" y="74" fill="#58a6ff" font-size="14" class="font-mono" font-weight="600">khoa@homelab</text>
  <text x="136" y="74" fill="#8b949e" font-size="14" class="font-mono">:</text>
  <text x="146" y="74" fill="#7ee787" font-size="14" class="font-mono">~</text>
  <text x="156" y="74" fill="#8b949e" font-size="14" class="font-mono">$</text>
  <text x="172" y="74" fill="#e6edf3" font-size="14" class="font-mono">neofetch --homelab</text>

  <!-- Column 1: System Telemetry (Left) -->
  <g transform="translate(32, 100)" class="font-mono">
    <text x="0" y="16"><tspan class="head">SYSTEM // NODE</tspan><tspan class="div"> -----------------------</tspan></text>
    <text x="0" y="42"><tspan class="key">OS:        </tspan><tspan class="val">Linux (Synology DSM 7.2)</tspan></text>
    <text x="0" y="66"><tspan class="key">Host:      </tspan><tspan class="val">Bare-Metal Docker Cluster</tspan></text>
    <text x="0" y="90"><tspan class="key">Kernel:    </tspan><tspan class="val">Software &amp; Systems Engineer</tspan></text>
    <text x="0" y="114"><tspan class="key">Uptime:    </tspan><tspan class="val">33 years, 9 months, 9 days</tspan></text>
    <text x="0" y="138"><tspan class="key">IDE:       </tspan><tspan class="val">Neovim, VS Code, GoLand</tspan></text>
    <text x="0" y="162"><tspan class="key">Core Code: </tspan><tspan class="val">Go, TypeScript, Next.js, SQLite</tspan></text>
    <text x="0" y="186"><tspan class="key">Focus:     </tspan><tspan class="val">High-perf tools &amp; clean arch</tspan></text>
  </g>

  <!-- Vertical Divider Line between columns -->
  <line x1="430" y1="102" x2="430" y2="305" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Column 2: Self-Hosted & Network (Right) -->
  <g transform="translate(450, 100)" class="font-mono">
    <text x="0" y="16"><tspan class="head">NETWORK // OPS</tspan><tspan class="div"> -----------------------</tspan></text>
    <text x="0" y="42"><tspan class="key">Self-Hosted: </tspan><tspan class="val">Forgejo, NGINX, Private CI/CD</tspan></text>
    <text x="0" y="66"><tspan class="key">Portal:      </tspan><tspan class="val">khoavo.myds.me</tspan></text>
    <text x="0" y="90"><tspan class="key">Private Git: </tspan><tspan class="val">git.khoavo.myds.me/vndangkhoa</tspan></text>
    <text x="0" y="114"><tspan class="key">Contact:     </tspan><tspan class="val">vonguyendangkhoa@gmail.com</tspan></text>
    <text x="0" y="138"><tspan class="key">LinkedIn:    </tspan><tspan class="val">linkedin.com/in/khoavo93</tspan></text>
    <text x="0" y="162"><tspan class="key">Git Stats:   </tspan><tspan class="val">Repos: 17 | Followers: 6 | Stars: 99</tspan></text>
    <text x="0" y="186"><tspan class="key">Status:      </tspan><tspan fill="#3fb950" font-weight="bold">ONLINE</tspan><tspan class="val"> — Shipping code</tspan></text>
    
    <!-- Color Palette Blocks -->
    <g transform="translate(0, 198)">
      <rect x="0" y="0" width="20" height="9" rx="2" fill="#ff7b72" />
      <rect x="24" y="0" width="20" height="9" rx="2" fill="#ffa657" />
      <rect x="48" y="0" width="20" height="9" rx="2" fill="#7ee787" />
      <rect x="72" y="0" width="20" height="9" rx="2" fill="#58a6ff" />
      <rect x="96" y="0" width="20" height="9" rx="2" fill="#bc8cff" />
      <rect x="120" y="0" width="20" height="9" rx="2" fill="#39d353" />
    </g>
  </g>

  <!-- Prompt at the bottom with blinking cursor -->
  <g transform="translate(32, 345)" class="font-mono">
    <text x="0" y="0" fill="#58a6ff" font-size="14" font-weight="600">khoa@homelab</text>
    <text x="104" y="0" fill="#8b949e" font-size="14">:</text>
    <text x="114" y="0" fill="#7ee787" font-size="14">~</text>
    <text x="124" y="0" fill="#8b949e" font-size="14">$</text>
    <text x="140" y="0" fill="#e6edf3" font-size="14">cat /etc/motd</text>
    <text x="254" y="0" fill="#8b949e" font-size="14"># Welcome to the homelab node!</text>
    <rect x="515" y="-13" width="8.5" height="16" fill="#58a6ff" class="cursor" />
  </g>
</svg>