<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#bc8cff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .cursor {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
  </style>

  <!-- Outer Window with subtle gradient border -->
  <rect x="1" y="1" width="848" height="368" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Terminal Header / Titlebar -->
  <path d="M 1 13 A 12 12 0 0 1 13 1 L 837 1 A 12 12 0 0 1 849 13 L 849 42 L 1 42 Z" fill="#161b22" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls (macOS style) -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="425" y="26" fill="#8b949e" font-size="13" class="font-mono" text-anchor="middle" font-weight="500">
    khoa@homelab: ~ (zsh)
  </text>

  <!-- Status Pill in Titlebar -->
  <g transform="translate(710, 12)">
    <rect width="115" height="18" rx="9" fill="#21262d" stroke="#30363d" />
    <circle cx="12" cy="9" r="4" fill="#3fb950" filter="url(#glow)" />
    <text x="24" y="13" fill="#8b949e" font-size="10" class="font-mono">ONLINE 99.9%</text>
  </g>

  <!-- Terminal Body Content -->

  <!-- Command Prompt Line -->
  <text x="32" y="74" fill="#58a6ff" font-size="14" class="font-mono" font-weight="600">khoa@homelab</text>
  <text x="136" y="74" fill="#8b949e" font-size="14" class="font-mono">:</text>
  <text x="146" y="74" fill="#7ee787" font-size="14" class="font-mono">~</text>
  <text x="156" y="74" fill="#8b949e" font-size="14" class="font-mono">$</text>
  <text x="172" y="74" fill="#e6edf3" font-size="14" class="font-mono">neofetch --homelab</text>

  <!-- Left: Homelab Server Graphic -->
  <g transform="translate(32, 98)">
    <!-- Server Rack Frame -->
    <rect x="0" y="0" width="165" height="195" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    
    <!-- Top Unit: Docker Cluster -->
    <rect x="8" y="10" width="149" height="38" rx="4" fill="#161b22" stroke="#21262d" />
    <circle cx="22" cy="29" r="3.5" fill="#3fb950" class="pulse-dot" />
    <circle cx="34" cy="29" r="3.5" fill="#58a6ff" />
    <circle cx="46" cy="29" r="3.5" fill="#58a6ff" />
    <text x="60" y="33" fill="#8b949e" font-size="11" class="font-mono">DOCKER // CLOUD</text>

    <!-- Mid Unit: Forgejo Git Node -->
    <rect x="8" y="56" width="149" height="38" rx="4" fill="#161b22" stroke="#21262d" />
    <circle cx="22" cy="75" r="3.5" fill="#ff7b72" />
    <circle cx="34" cy="75" r="3.5" fill="#3fb950" class="pulse-dot" />
    <text x="50" y="79" fill="#8b949e" font-size="11" class="font-mono">FORGEJO // GIT</text>

    <!-- Bottom Unit: Storage & Synology NAS -->
    <rect x="8" y="102" width="149" height="38" rx="4" fill="#161b22" stroke="#21262d" />
    <circle cx="22" cy="121" r="3.5" fill="#3fb950" class="pulse-dot" />
    <circle cx="34" cy="121" r="3.5" fill="#d29922" />
    <text x="50" y="125" fill="#8b949e" font-size="11" class="font-mono">NAS // STORAGE</text>

    <!-- CI Runner Node -->
    <rect x="8" y="148" width="149" height="38" rx="4" fill="#161b22" stroke="#21262d" />
    <circle cx="22" cy="167" r="3.5" fill="#3fb950" class="pulse-dot" />
    <circle cx="34" cy="167" r="3.5" fill="#3fb950" />
    <text x="50" y="171" fill="#8b949e" font-size="11" class="font-mono">CI // RUNNERS</text>
  </g>

  <!-- Right: Neofetch Details -->
  <g transform="translate(225, 96)">
    <!-- Header Title -->
    <text x="0" y="18" fill="url(#accentGrad)" font-size="18" class="font-mono" font-weight="700">Khoa Vo (vndangkhoa)</text>
    <line x1="0" y1="26" x2="585" y2="26" stroke="#30363d" stroke-width="1" />

    <!-- Info Lines -->
    <text x="0" y="50" fill="#58a6ff" font-size="13" class="font-mono" font-weight="600">Role</text>
    <text x="95" y="50" fill="#8b949e" font-size="13" class="font-mono">:</text>
    <text x="110" y="50" fill="#e6edf3" font-size="13" class="font-mono">Software Engineer &amp; Systems Builder</text>

    <text x="0" y="74" fill="#58a6ff" font-size="13" class="font-mono" font-weight="600">OS / Node</text>
    <text x="95" y="74" fill="#8b949e" font-size="13" class="font-mono">:</text>
    <text x="110" y="74" fill="#e6edf3" font-size="13" class="font-mono">Linux (Synology DSM / Docker bare-metal cluster)</text>

    <text x="0" y="98" fill="#58a6ff" font-size="13" class="font-mono" font-weight="600">Self-Hosted</text>
    <text x="95" y="98" fill="#8b949e" font-size="13" class="font-mono">:</text>
    <text x="110" y="98" fill="#7ee787" font-size="13" class="font-mono">Forgejo Git, NGINX, Private CI/CD, Homelab Cloud</text>

    <text x="0" y="122" fill="#58a6ff" font-size="13" class="font-mono" font-weight="600">Core Stack</text>
    <text x="95" y="122" fill="#8b949e" font-size="13" class="font-mono">:</text>
    <text x="110" y="122" fill="#e6edf3" font-size="13" class="font-mono">Go, TypeScript, Next.js, React, Docker, SQLite</text>

    <text x="0" y="146" fill="#58a6ff" font-size="13" class="font-mono" font-weight="600">Focus</text>
    <text x="95" y="146" fill="#8b949e" font-size="13" class="font-mono">:</text>
    <text x="110" y="146" fill="#e6edf3" font-size="13" class="font-mono">High-performance tools, file systems &amp; clean architecture</text>

    <text x="0" y="170" fill="#58a6ff" font-size="13" class="font-mono" font-weight="600">Status</text>
    <text x="95" y="170" fill="#8b949e" font-size="13" class="font-mono">:</text>
    <circle cx="115" cy="166" r="4" fill="#3fb950" filter="url(#glow)" />
    <text x="126" y="170" fill="#3fb950" font-size="13" class="font-mono" font-weight="600">ONLINE</text>
    <text x="185" y="170" fill="#8b949e" font-size="13" class="font-mono">— Building open-source &amp; shipping code</text>

    <!-- Color Palette Blocks -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="22" height="11" rx="3" fill="#ff7b72" />
      <rect x="26" y="0" width="22" height="11" rx="3" fill="#d29922" />
      <rect x="52" y="0" width="22" height="11" rx="3" fill="#7ee787" />
      <rect x="78" y="0" width="22" height="11" rx="3" fill="#58a6ff" />
      <rect x="104" y="0" width="22" height="11" rx="3" fill="#bc8cff" />
      <rect x="130" y="0" width="22" height="11" rx="3" fill="#39d353" />
    </g>
  </g>

  <!-- Prompt at the bottom with blinking cursor -->
  <g transform="translate(32, 335)">
    <text x="0" y="0" fill="#58a6ff" font-size="14" class="font-mono" font-weight="600">khoa@homelab</text>
    <text x="104" y="0" fill="#8b949e" font-size="14" class="font-mono">:</text>
    <text x="114" y="0" fill="#7ee787" font-size="14" class="font-mono">~</text>
    <text x="124" y="0" fill="#8b949e" font-size="14" class="font-mono">$</text>
    <text x="140" y="0" fill="#e6edf3" font-size="14" class="font-mono">cat /etc/motd</text>
    <text x="254" y="0" fill="#8b949e" font-size="14" class="font-mono"># Welcome to the homelab node!</text>
    <rect x="515" y="-13" width="8.5" height="16" fill="#58a6ff" class="cursor" />
  </g>
</svg>
